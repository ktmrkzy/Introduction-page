<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勝村和也 | Katsumura Kazuya - Presentations</title>
    <meta name="description" content="勝村和也（Katsumura Kazuya）の発表・プレゼンテーションを紹介します。">
    <meta name="author" content="勝村和也 (Katsumura Kazuya)">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar">
        <div class="container">
            <h1 class="logo" id="siteName">My Portfolio</h1>
            <ul class="nav-links">
                <li><a href="index.html#about">Profile</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#activities">Activities</a></li>
                <li><a href="index.html#presentations">Presentations</a></li>
                <li><a href="index.html#experience">Experience</a></li>
                <li><a href="index.html#links">Links</a></li>
            </ul>
        </div>
    </nav>

    <!-- 詳細セクション -->
    <section class="detail-section">
        <div class="container">
            <div class="detail-header">
                <h2>Presentations</h2>
                <a href="index.html" class="back-link">← Back</a>
            </div>
            <div class="detail-list" id="presentationsContainer">
                <!-- JSONから動的に生成されます -->
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p id="footerText">&copy; 2026 My Portfolio. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // JSONファイルを読み込む関数
        async function loadJSON(path) {
            try {
                const response = await fetch(path);
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`${path} failed to load:`, error);
                return {};
            }
        }

        // サイト名を読み込む
        async function loadSiteName() {
            const profileData = await loadJSON('datas/profile.json');
            document.getElementById('siteName').textContent = profileData.siteName || 'My Portfolio';
            document.getElementById('footerText').textContent = profileData.footer || '© 2026 My Portfolio. All rights reserved.';
        }

        // 対外発表を描画
        async function renderPresentations() {
            const data = await loadJSON('datas/presentations.json');
            const container = document.getElementById('presentationsContainer');
            container.innerHTML = '';

            if (data.presentations && Array.isArray(data.presentations)) {
                // 逆順で表示
                const reversedPresentations = data.presentations.reverse();
                reversedPresentations.forEach((presentation, index) => {
                    const presentationItem = document.createElement('div');
                    presentationItem.className = 'detail-item';
                    presentationItem.innerHTML = `
                        <div class="detail-card">
                            <div class="detail-number">${String(index + 1).padStart(3, '0')}</div>
                            <div class="detail-content">
                                <div class="detail-date">${presentation.date}</div>
                                <h3>${presentation.title}</h3>
                                <p>${presentation.description}</p>
                                <div class="detail-venue">${presentation.venue}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(presentationItem);
                });
            }
        }

        // ページロード時に実行
        document.addEventListener('DOMContentLoaded', () => {
            loadSiteName();
            renderPresentations();
        });
    </script>
</body>
</html>
